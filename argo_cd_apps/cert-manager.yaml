apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  source:
    path: ''
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.1
    chart: cert-manager
    helm:
      parameters:
        - name: namespace
          value: cert-manager
        - name: crds.enabled
          value: 'true'
  sources: []
  project: default
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true